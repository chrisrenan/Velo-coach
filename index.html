<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velo Coach</title><meta name="theme-color" content="#000091"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Velo Coach">
<style>@font-face{font-family:Marianne;font-weight:400;font-display:swap;src:local("Marianne"),url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/fonts/Marianne-Regular.woff2) format("woff2")}
@font-face{font-family:Marianne;font-weight:500;font-display:swap;src:local("Marianne"),url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/fonts/Marianne-Medium.woff2) format("woff2")}
@font-face{font-family:Marianne;font-weight:700;font-display:swap;src:local("Marianne"),url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/fonts/Marianne-Bold.woff2) format("woff2")}

:root{--bg:#f6f6f6;--sf:#fff;--tx:#161616;--mu:#666;--ac:#000091;--on:#fff;--ok:#18753c;--wa:#b34000;--ko:#ce0500;--bd:#e3e3e8;--hf:#000091;--ht:#3a3ad4;--f:Marianne,"Segoe UI",system-ui,-apple-system,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--sf:#1c1c1e;--tx:#ececf0;--mu:#a1a1ad;--ac:#9a9afc;--on:#121212;--ok:#3fc380;--wa:#f4a259;--ko:#ff7b6e;--bd:#2f2f36;--hf:#1b1b9c;--ht:#4a4ae0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--sf:#1c1c1e;--tx:#ececf0;--mu:#a1a1ad;--ac:#9a9afc;--on:#121212;--ok:#3fc380;--wa:#f4a259;--ko:#ff7b6e;--bd:#2f2f36;--hf:#1b1b9c;--ht:#4a4ae0;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15.5px/1.5 var(--f);-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:12px 16px 104px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 2px 14px}.top b{font:700 20px/1 var(--f);color:var(--ac);letter-spacing:-.01em}.top span{font-size:13px;color:var(--mu);text-transform:capitalize}
h1,h2,h3{font-family:var(--f);margin:0;font-weight:700}
h2{font-size:17px;line-height:1.2;margin:28px 0 10px;display:flex;align-items:center;gap:8px}h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--ac)}
h3{font-size:15px;margin:16px 0 6px}
.mu{color:var(--mu);font-size:13px}.big{font:700 60px/1 var(--f);letter-spacing:-.03em}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:10px 0}
.hero{background:linear-gradient(135deg,var(--hf),var(--ht));color:#fff;border-radius:20px;padding:20px 18px 14px}.hero .mu{color:rgba(255,255,255,.8)}.hero .days{height:84px}.hero .days i{background:#fff}.hero .days div{color:rgba(255,255,255,.8)}
.days{display:flex;gap:6px;align-items:flex-end;height:64px;margin-top:12px}.days div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.days i{display:block;background:var(--ac);border-radius:4px;min-height:3px;margin-bottom:3px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.g>div{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 14px}
.g b{display:block;font:700 22px/1.15 var(--f);letter-spacing:-.01em}.g span{font-size:12px;color:var(--mu)}
.ch{width:100%;height:auto;display:block}.ch text{fill:var(--mu);font-size:10px}
label{display:block;font-size:12.5px;color:var(--mu);font-weight:500}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin-top:4px;font-size:16px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f .w{grid-column:1/-1}
.b{background:var(--ac);color:var(--on);border:0;border-radius:10px;min-height:44px;padding:10px 18px;font-weight:700;cursor:pointer;margin-top:12px}
.b.s{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}.b.d{background:transparent;color:var(--ko);border:1.5px solid var(--ko)}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}.row:last-child{border-bottom:0}
.ok{color:var(--ok)}.wa{color:var(--wa)}.ko{color:var(--ko)}
ul{padding-left:18px;margin:6px 0}li{margin:5px 0}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--sf) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--bd);display:flex;padding:6px 4px env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:4px 0;font-size:10px;font-weight:500;color:var(--mu);cursor:pointer}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 3px}
nav .on{color:var(--ac);font-weight:700}
.today{border-left:3px solid var(--ac);padding-left:10px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body>
<main id="v"></main>
<nav>
<button data-t="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
<button data-t="acts" onclick="go('acts')"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Séances</button>
<button data-t="plan" onclick="go('plan')"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
<button data-t="coach" onclick="go('coach')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>Coach</button>
<button data-t="wx" onclick="go('wx')"><svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 9.6 4.2 4.2 0 0 0 7 18z"/></svg>Météo</button>
<button data-t="wt" onclick="go('wt')"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8.5 9a4.5 4.5 0 0 1 7 0M12 9l1.8-1.8"/></svg>Poids</button>
<button data-t="prof" onclick="go('prof')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profil</button>
</nav>
<script>
const K='velocoach',$=s=>document.querySelector(s);
const T=["Vélo de route","Vélo d’intérieur","MyWhoosh","Marche","Course à pied","Renforcement","Repos"];
const bike=a=>T.slice(0,3).includes(a.type);
const D={profile:{age:40,weight:92,height:'',goalW:'',fcmax:170,rideDay:6,renfo:2},acts:[],weights:[],recov:[]};
let S=null,tab='home',edit=null,msg='',io='',draft=null,wx=null,wxErr='',wxBusy=false;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.profile)S=JSON.parse(JSON.stringify(D));
S.profile=Object.assign({},D.profile,S.profile);
const td=()=>new Date().toLocaleDateString('sv');
const addd=(s,k)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+k);return d.toLocaleDateString('sv')};
const dn=s=>Math.round((new Date(td()+'T12:00')-new Date(s+'T12:00'))/864e5);
if(!S.weights.length)S.weights.push({d:td(),w:S.profile.weight});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>v===''||v==null||isNaN(+v)?null:+v;
const sum=(a,f)=>a.reduce((t,x)=>t+(f(x)||0),0);
const avg=a=>a.length?a.reduce((t,x)=>t+x,0)/a.length:null;
const f1=(v,d=1)=>v==null?'–':(+v).toFixed(d).replace('.',',');
const hm=m=>Math.floor(m/60)+' h '+String(Math.round(m%60)).padStart(2,'0');
const fd=s=>new Date(s+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
function st(l){l=l.filter(a=>a.type!='Repos');const km=sum(l,a=>a.dist),mn=sum(l,a=>a.dur);
 return{n:l.length,km,mn,dp:sum(l,a=>a.dp),sp:km&&mn?km/(mn/60):null,fc:avg(l.map(a=>a.fa).filter(x=>x))}}
const lg=()=>S.acts.filter(a=>bike(a)&&a.dist>=70).sort((a,b)=>b.d.localeCompare(a.d));
function lgl(){const l=lg().slice(0,5);return l.length?l.map(a=>`<div class="row"><b>${fd(a.d)}</b><span>${f1(a.dist,0)} km · ${f1(a.sp)} km/h · ${a.dp==null?'D+ ?':a.dp+' m D+ ('+Math.round(a.dp/a.dist*10)+' m/10 km)'}${a.fa?' · FC '+a.fa:''}</span></div>`).join(''):'<p class="mu">Aucune sortie de 70 km ou plus pour l’instant.</p>'}
function wtrend(){const w=[...S.weights].filter(x=>dn(x.d)<=28).sort((a,b)=>a.d.localeCompare(b.d));
 if(w.length<2)return null;const sp=dn(w[0].d)-dn(w[w.length-1].d);if(sp<7)return null;
 return(w[w.length-1].w-w[0].w)/sp*7}
function line(p,mm){if(p.length<2)return'<p class="mu">Au moins 2 points sont nécessaires pour tracer la courbe.</p>';
 const W=320,H=120,ys=p.map(a=>a.y).concat(mm?p.map(a=>a.m):[]),mn=Math.min(...ys),mx=Math.max(...ys),r=(mx-mn)||1;
 const X=i=>10+i*(W-20)/(p.length-1),Y=v=>H-18-(v-mn)/r*(H-40);
 let s=`<svg viewBox="0 0 ${W} ${H}" class="ch"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${p.map((a,i)=>X(i)+','+Y(a.y)).join(' ')}"/>`;
 if(mm)s+=`<polyline fill="none" stroke="var(--ok)" stroke-width="2" stroke-dasharray="4 3" points="${p.map((a,i)=>X(i)+','+Y(a.m)).join(' ')}"/>`;
 s+=p.map((a,i)=>`<circle cx="${X(i)}" cy="${Y(a.y)}" r="2.5" fill="var(--ac)"/>`).join('');
 return s+`<text x="10" y="10">${f1(mx)}</text><text x="10" y="${H-2}">${f1(mn)}</text><text x="${W-10}" y="${H-2}" text-anchor="end">${fd(p[p.length-1].l)}</text></svg>`}
function bars(v,l){const mx=Math.max(...v,1);return`<div class="days" style="height:90px">${v.map((x,i)=>`<div><i style="height:${x/mx*64}px"></i>${l[i]}</div>`).join('')}</div>`}
function wkKm(k){return sum(S.acts.filter(a=>bike(a)&&Math.floor(dn(a.d)/7)==k),a=>a.dist)}
function recovBad(){const r=S.recov.filter(x=>dn(x.d)<=2).pop();return r&&(r.sl<=2||r.fa>=4||r.so>=4||r.mo<=2)?r:null}

const sg=(v,d=1)=>(v>0?'+':'')+f1(v,d);
const CATS=['Courte (moins de 45 km)','Moyenne (45 à 70 km)','Longue (70 km et plus)'];
const cat=a=>a.dist>=70?CATS[2]:a.dist>=45?CATS[1]:CATS[0];
const rel=a=>a.dp==null||!a.dist?null:a.dp/a.dist;
const ride=()=>S.acts.filter(a=>a.type=="Vélo de route"&&a.dist>=25&&a.sp).sort((a,b)=>a.d.localeCompare(b.d));
const load=a=>a.type=='Repos'?0:(a.dur||0)*(a.rpe||5);
const wl=k=>sum(S.acts.filter(a=>dn(a.d)>=0&&Math.floor(dn(a.d)/7)==k),load);
function acwr(){const c=(wl(1)+wl(2)+wl(3)+wl(4))/4,a=wl(0);return c>0?{a,c,r:a/c}:null}
const acl=r=>r>1.5?['ko','Charge très élevée : risque de fatigue, allège cette semaine.']:r>1.3?['wa','Charge en nette hausse : reste prudent.']:r>=0.8?['ok','Charge équilibrée.']:['wa','Charge en baisse : tu peux reprendre progressivement.'];
function perf(){return CATS.map(c=>{const l=ride().filter(a=>cat(a)==c);if(l.length<4)return{c,n:l.length};
 const m=x=>({s:avg(x.map(a=>a.sp)),f:avg(x.filter(a=>a.fa).map(a=>a.fa)),r:avg(x.map(rel).filter(v=>v!=null))}),
 b=m(l.slice(-3)),p=m(l.slice(Math.max(0,l.length-6),l.length-3)),ds=b.s-p.s,df=b.f!=null&&p.f!=null?b.f-p.f:null;let v;
 if(b.r!=null&&p.r!=null&&Math.abs(b.r-p.r)>Math.max(3,0.4*Math.max(b.r,p.r)))v='Relief très différent entre les deux groupes de sorties : comparaison peu fiable.';
 else if(ds>=0.3&&(df==null||df<=2))v='Progrès net : tu vas plus vite sans solliciter davantage ton cœur.';
 else if(ds>=0.3)v='Plus rapide, mais avec un cœur plus sollicité : plus d’intensité, pas forcément de progrès.';
 else if(ds>-0.3&&df!=null&&df<=-3)v='Même allure avec une FC plus basse : ton endurance s’améliore.';
 else if(ds>-0.3)v='Niveau stable.';
 else v='Allure en baisse : fatigue, vent ou relief ? Vérifie ton sommeil et ta charge.';
 return{c,n:l.length,ds,df,v}})}
function recs(){const o=[],B=S.acts.filter(bike),mx=(l,f)=>l.reduce((b,a)=>!b||f(a)>f(b)?a:b,null),L=mx(B.filter(a=>a.dist),a=>a.dist),H=mx(B.filter(a=>a.dp),a=>a.dp);
 if(L)o.push(['Plus longue sortie',f1(L.dist,0)+' km',L.d]);if(H)o.push(['Plus gros dénivelé',H.dp+' m',H.d]);
 CATS.forEach(c=>{const b=mx(ride().filter(a=>cat(a)==c),a=>a.sp);if(b)o.push(['Meilleure moyenne · '+c.split(' ')[0],f1(b.sp)+' km/h',b.d])});return o}
function home(){
 const A=S.acts.filter(a=>a.type!='Repos'),mon=addd(td(),-((new Date().getDay()+6)%7)),wk=A.filter(a=>a.d>=mon&&dn(a.d)>=0),mo=A.filter(a=>a.d.slice(0,7)==td().slice(0,7)),w=st(wk),m=st(mo),
 dl=['L','M','M','J','V','S','D'],dv=dl.map((_,i)=>sum(wk.filter(a=>a.d==addd(mon,i)),a=>a.dist)),
 reg=[0,1,2,3].filter(k=>A.filter(a=>Math.floor(dn(a.d)/7)==k).length>=2).length,lw=[...S.weights].sort((a,b)=>a.d.localeCompare(b.d)).pop(),
 k8=[7,6,5,4,3,2,1,0].map(wkKm),ac=acwr(),pf=perf(),RC=recs(),ef=ride().filter(a=>a.fa).slice(-12).map(a=>({l:a.d,y:a.sp/a.fa*100}));
 return`<div class="hero"><span class="mu">Cette semaine</span><div class="big">${f1(w.km,0)} <small style="font-size:28px">km</small></div>${bars(dv,dl)}</div>
 <div class="g" style="margin-top:14px"><div><b>${w.n}</b><span>séances</span></div><div><b>${hm(w.mn)}</b><span>temps d’entraînement</span></div>
 <div><b>${f1(w.dp,0)} m</b><span>dénivelé positif</span></div><div><b>${f1(w.sp)} km/h</b><span>vitesse moyenne</span></div>
 <div><b>${f1(w.fc,0)} bpm</b><span>FC moyenne</span></div><div><b>${f1(m.km,0)} km</b><span>ce mois-ci</span></div>
 <div><b>${lw.w} kg</b><span>poids actuel</span></div><div><b>${reg}/4</b><span>régularité (semaines à 2+ séances)</span></div></div>
 ${ac?`<div class="box"><b class="${acl(ac.r)[0]}">${acl(ac.r)[1]}</b><br><span class="mu">Charge des 7 derniers jours : ${Math.round(ac.a)}, contre ${Math.round(ac.c)} par semaine le mois précédent (charge = durée × ressenti, 5 si non renseigné).</span></div>`:''}
 ${ridecard()}<h2>Ta progression</h2><div class="box" style="padding:4px 14px">${pf.map(x=>x.v?`<div class="row" style="display:block"><b>${x.c}</b><br>${x.v}<br><span class="mu">${sg(x.ds)} km/h${x.df==null?'':' · FC '+sg(x.df,0)+' bpm'} sur les 3 dernières sorties par rapport aux précédentes</span></div>`:`<div class="row"><span>${x.c}</span><span class="mu">${x.n}/4 sorties</span></div>`).join('')}</div>
 <p class="mu">Il faut 4 sorties route d’une même catégorie pour mesurer ta progression. Le vent et le relief faussent un peu les comparaisons.</p>
 <h2>Kilométrage hebdomadaire</h2><div class="box">${bars(k8.map(x=>Math.round(x)),k8.map(x=>Math.round(x)))}<span class="mu">8 dernières semaines, vélo uniquement</span></div>
 <h2>Efficacité</h2><div class="box">${line(ef)}<span class="mu">Vitesse par 100 bpm sur tes sorties route. Plus la courbe monte, plus tu vas vite pour un même effort cardiaque.</span></div>
 <h2>Sorties longues (70 km et plus)</h2><div class="box" style="padding:4px 14px">${lgl()}</div>
 <h2>Records</h2><div class="box" style="padding:4px 14px">${RC.length?RC.map(r=>`<div class="row"><span>${r[0]}</span><span><b>${r[1]}</b> <span class="mu">${fd(r[2])}</span></span></div>`).join(''):'<p class="mu">Tes records apparaîtront après quelques séances.</p>'}</div>`}
const F=(id,l,v,t='number',x='step="any" inputmode="decimal"',w='')=>`<label class="${w}">${l}<input id="a_${id}" type="${t}" value="${esc(v??'')}" ${t=='number'?x:''}></label>`;
function acts(){
 const e=edit?S.acts.find(a=>a.id==edit):null,v=e||draft||{d:td(),type:T[0]};
 const list=[...S.acts].sort((a,b)=>b.d.localeCompare(a.d)).map(a=>`<div class="row"><div><b>${fd(a.d)} · ${a.type}</b><br><span class="mu">${a.dist?f1(a.dist)+' km · ':''}${a.dur?hm(a.dur)+' · ':''}${a.sp?f1(a.sp)+' km/h · ':''}${a.dp?a.dp+' m D+ · ':''}${a.fa?'FC '+a.fa+(a.fm?'/'+a.fm:'')+' · ':''}${a.pw?'≈'+a.pw+' W (estimée) · ':''}${a.rpe?'ressenti '+a.rpe+'/10':''}${a.c?'<br>'+esc(a.c):''}</span></div>
 <div style="white-space:nowrap"><button class="b s" onclick="ed(${a.id})">Modifier</button> <button class="b d" onclick="del(${a.id})">Suppr.</button></div></div>`).join('');
 return`<div class="box"><label>Importer un fichier de ton compteur (.gpx ou .fit)<input type="file" accept=".gpx,.fit" onchange="imf(this)"></label><span class="mu">Les champs se remplissent : vérifie, ajoute ton ressenti, puis enregistre.</span></div><h2>${e?'Modifier la séance':'Nouvelle séance'}</h2><div class="box"><div class="f">
 ${F('d','Date',v.d,'date')}<label>Type<select id="a_t">${T.map(t=>`<option${t==v.type?' selected':''}>${t}</option>`).join('')}</select></label>
 ${F('dist','Distance (km)',v.dist)}${F('dur','Durée (min)',v.dur)}${F('sp','Vitesse moy. (km/h, auto si vide)',v.sp)}${F('dp','Dénivelé + (m)',v.dp)}
 ${F('fa','FC moyenne (bpm)',v.fa)}${F('fm','FC max (bpm)',v.fm)}${F('pw','Puissance moy. (W, estimation Strava)',v.pw)}${F('rpe','Ressenti (1 à 10)',v.rpe)}
 <label class="w">Commentaire<textarea id="a_c" rows="2">${esc(v.c)}</textarea></label></div>
 <p class="ko" style="margin:8px 0 0">${msg}</p><button class="b" onclick="saveAct()">Enregistrer la séance</button>${e||draft?' <button class="b s" onclick="edit=null;draft=null;msg=\'\';R()">Annuler</button>':''}</div>
 <h2>Historique</h2><div class="box" style="padding:4px 14px">${list||'<p class="mu">Aucune séance. Saisis ta dernière sortie ci-dessus.</p>'}</div>
 <p class="mu">Import GPX et FIT disponible en haut de page. Le format TCX n’est pas géré.</p>`}
function saveAct(){const g=i=>$('#a_'+i).value;
 const a={id:edit||Date.now(),d:g('d'),type:g('t'),dist:n(g('dist')),dur:n(g('dur')),sp:n(g('sp')),dp:n(g('dp')),fa:n(g('fa')),fm:n(g('fm')),pw:n(g('pw')),rpe:n(g('rpe')),c:g('c').trim()};
 msg='';if(!a.d)msg='Choisis une date.';
 else if(a.type!='Repos'&&!a.dist&&!a.dur)msg='Renseigne au moins la distance ou la durée.';
 else if(a.fa&&a.fm&&a.fa>a.fm)msg='La FC moyenne dépasse la FC max : vérifie ta saisie.';

<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velo Coach</title><meta name="theme-color" content="#1d4ed8"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Velo Coach">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--sf:#fff;--tx:#0f1c26;--mu:#5d6e7b;--ac:#1d4ed8;--ok:#1f8a4c;--wa:#b86e00;--ko:#c0392b;--bd:#d6dde3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d161d;--sf:#15212b;--tx:#e8eef3;--mu:#8fa1af;--ac:#6ea0ff;--ok:#4cc380;--wa:#e8a33d;--ko:#ef7a6c;--bd:#263541;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d161d;--sf:#15212b;--tx:#e8eef3;--mu:#8fa1af;--ac:#6ea0ff;--ok:#4cc380;--wa:#e8a33d;--ko:#ef7a6c;--bd:#263541;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1,h2,h3{font-family:"Barlow Condensed",Impact,sans-serif;margin:0;font-weight:700}
h2{font-size:22px;margin:22px 0 8px}h3{font-size:18px;margin:14px 0 6px}
.mu{color:var(--mu);font-size:14px}.big{font:700 72px/1 "Barlow Condensed",Impact,sans-serif}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:10px 0}
.hero{padding:6px 0 4px}.days{display:flex;gap:6px;align-items:flex-end;height:64px;margin-top:10px}
.days div{flex:1;text-align:center;font-size:12px;color:var(--mu)}.days i{display:block;background:var(--ac);border-radius:3px;min-height:3px;opacity:.9}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--bd);border-radius:10px;background:var(--sf);overflow:hidden}
.g>div{padding:12px 14px;border-bottom:1px solid var(--bd)}.g>div:nth-child(odd){border-right:1px solid var(--bd)}
.g b{display:block;font:700 28px/1.1 "Barlow Condensed",sans-serif}.g span{font-size:13px;color:var(--mu)}
.ch{width:100%;height:auto;display:block}.ch text{fill:var(--mu);font-size:10px}
label{display:block;font-size:13px;color:var(--mu)}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin-top:3px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f .w{grid-column:1/-1}
.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:600;cursor:pointer;margin-top:12px}
.b.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}.b.d{background:transparent;color:var(--ko);border:1px solid var(--ko)}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.ok{color:var(--ok)}.wa{color:var(--wa)}.ko{color:var(--ko)}
ul{padding-left:18px;margin:6px 0}li{margin:4px 0}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:8px 0;font-size:10px;color:var(--mu);cursor:pointer}nav button span{display:block;font-size:20px}nav .on{color:var(--ac);font-weight:600}
.today{border-left:3px solid var(--ac);padding-left:10px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body>
<main id="v"></main>
<nav>
<button data-t="home" onclick="go('home')"><span>🏠</span>Accueil</button>
<button data-t="acts" onclick="go('acts')"><span>🚴</span>Activités</button>
<button data-t="plan" onclick="go('plan')"><span>📅</span>Programme</button>
<button data-t="coach" onclick="go('coach')"><span>🧠</span>Coach</button>
<button data-t="wx" onclick="go('wx')"><span>🌤️</span>Météo</button>
<button data-t="wt" onclick="go('wt')"><span>⚖️</span>Poids</button>
<button data-t="prof" onclick="go('prof')"><span>👤</span>Profil</button>
</nav>
<script>
const K='velocoach',$=s=>document.querySelector(s);
const T=["Vélo de route","Vélo d’intérieur","MyWhoosh","Marche","Course à pied","Renforcement","Repos"];
const bike=a=>T.slice(0,3).includes(a.type);
const D={profile:{age:40,weight:92,height:'',goalW:'',fcmax:170,baseSpeed:25,goalSpeed:27.5},acts:[],weights:[],recov:[]};
let S=null,tab='home',edit=null,msg='',io='',draft=null,wx=null,wxErr='',wxBusy=false;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.profile)S=JSON.parse(JSON.stringify(D));
const td=()=>new Date().toLocaleDateString('sv');
const addd=(s,k)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+k);return d.toLocaleDateString('sv')};
const dn=s=>Math.round((new Date(td()+'T12:00')-new Date(s+'T12:00'))/864e5);
if(!S.weights.length)S.weights.push({d:td(),w:S.profile.weight});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>v===''||v==null||isNaN(+v)?null:+v;
const sum=(a,f)=>a.reduce((t,x)=>t+(f(x)||0),0);
const avg=a=>a.length?a.reduce((t,x)=>t+x,0)/a.length:null;
const f1=(v,d=1)=>v==null?'–':(+v).toFixed(d).replace('.',',');
const hm=m=>Math.floor(m/60)+' h '+String(Math.round(m%60)).padStart(2,'0');
const fd=s=>new Date(s+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
function st(l){l=l.filter(a=>a.type!='Repos');const km=sum(l,a=>a.dist),mn=sum(l,a=>a.dur);
 return{n:l.length,km,mn,dp:sum(l,a=>a.dp),sp:km&&mn?km/(mn/60):null,fc:avg(l.map(a=>a.fa).filter(x=>x))}}
const comp=()=>S.acts.filter(a=>a.type=="Vélo de route"&&a.dist>=40&&a.dist<=60&&a.sp&&(a.dp==null||a.dp<=500)).sort((a,b)=>a.d.localeCompare(b.d));
const lg=()=>S.acts.filter(a=>bike(a)&&a.dist>=70).sort((a,b)=>b.d.localeCompare(a.d));
function lgl(){const l=lg().slice(0,5);return l.length?l.map(a=>`<div class="row"><b>${fd(a.d)}</b><span>${f1(a.dist,0)} km · ${f1(a.sp)} km/h · ${a.dp==null?'D+ ?':a.dp+' m D+ ('+Math.round(a.dp/a.dist*10)+' m/10 km)'}${a.fa?' · FC '+a.fa:''}</span></div>`).join(''):'<p class="mu">Aucune sortie de 70 km ou plus pour l’instant.</p>'}
function wtrend(){const w=[...S.weights].filter(x=>dn(x.d)<=28).sort((a,b)=>a.d.localeCompare(b.d));
 if(w.length<2)return null;const sp=dn(w[0].d)-dn(w[w.length-1].d);if(sp<7)return null;
 return(w[w.length-1].w-w[0].w)/sp*7}
function line(p,mm){if(p.length<2)return'<p class="mu">Au moins 2 points sont nécessaires pour tracer la courbe.</p>';
 const W=320,H=120,ys=p.map(a=>a.y).concat(mm?p.map(a=>a.m):[]),mn=Math.min(...ys),mx=Math.max(...ys),r=(mx-mn)||1;
 const X=i=>10+i*(W-20)/(p.length-1),Y=v=>H-18-(v-mn)/r*(H-40);
 let s=`<svg viewBox="0 0 ${W} ${H}" class="ch"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${p.map((a,i)=>X(i)+','+Y(a.y)).join(' ')}"/>`;
 if(mm)s+=`<polyline fill="none" stroke="var(--ok)" stroke-width="2" stroke-dasharray="4 3" points="${p.map((a,i)=>X(i)+','+Y(a.m)).join(' ')}"/>`;
 s+=p.map((a,i)=>`<circle cx="${X(i)}" cy="${Y(a.y)}" r="2.5" fill="var(--ac)"/>`).join('');
 return s+`<text x="10" y="10">${f1(mx)}</text><text x="10" y="${H-2}">${f1(mn)}</text><text x="${W-10}" y="${H-2}" text-anchor="end">${fd(p[p.length-1].l)}</text></svg>`}
function bars(v,l){const mx=Math.max(...v,1);return`<div class="days" style="height:90px">${v.map((x,i)=>`<div><i style="height:${x/mx*64}px"></i>${l[i]}</div>`).join('')}</div>`}
function wkKm(k){return sum(S.acts.filter(a=>bike(a)&&Math.floor(dn(a.d)/7)==k),a=>a.dist)}
function recovBad(){const r=S.recov.filter(x=>dn(x.d)<=2).pop();return r&&(r.sl<=2||r.fa>=4||r.so>=4||r.mo<=2)?r:null}

function home(){
 const A=S.acts.filter(a=>a.type!='Repos'),mon=addd(td(),-((new Date().getDay()+6)%7));
 const wk=A.filter(a=>a.d>=mon&&dn(a.d)>=0),mo=A.filter(a=>a.d.slice(0,7)==td().slice(0,7)),w=st(wk),m=st(mo);
 const dl=['L','M','M','J','V','S','D'],dv=dl.map((_,i)=>sum(wk.filter(a=>a.d==addd(mon,i)),a=>a.dist));
 const reg=[0,1,2,3].filter(k=>A.filter(a=>Math.floor(dn(a.d)/7)==k).length>=2).length;
 const c=comp(),cur=c.length?avg(c.slice(-3).map(a=>a.sp)):null,p=S.profile,pct=cur==null?0:Math.max(0,Math.min(100,(cur-p.baseSpeed)/(p.goalSpeed-p.baseSpeed)*100));
 const lw=[...S.weights].sort((a,b)=>a.d.localeCompare(b.d)).pop();
 const k8=[7,6,5,4,3,2,1,0].map(wkKm);
 return`<div class="hero"><span class="mu">Cette semaine</span><div class="big">${f1(w.km,0)} <small style="font-size:28px">km</small></div>${bars(dv,dl)}</div>
 <div class="g" style="margin-top:14px"><div><b>${w.n}</b><span>séances</span></div><div><b>${hm(w.mn)}</b><span>temps d’entraînement</span></div>
 <div><b>${f1(w.dp,0)} m</b><span>dénivelé positif</span></div><div><b>${f1(w.sp)} km/h</b><span>vitesse moyenne</span></div>
 <div><b>${f1(w.fc,0)} bpm</b><span>FC moyenne</span></div><div><b>${f1(m.km,0)} km</b><span>ce mois-ci</span></div>
 <div><b>${lw.w} kg</b><span>poids actuel</span></div><div><b>${reg}/4</b><span>régularité (semaines à 2+ séances)</span></div></div>
 <h2>Objectif vitesse sur 50 km</h2><div class="box"><div class="row" style="border:0;padding:0"><span>${f1(p.baseSpeed)} km/h</span><b>${cur==null?'–':f1(cur)+' km/h'}</b><span>${f1(p.goalSpeed)} km/h</span></div><div class="bar"><i style="width:${pct}%"></i></div>
 <span class="mu">${c.length<1?'Enregistre des sorties de vélo de route de 40 à 60 km pour suivre ta progression.':'Moyenne de tes 3 dernières sorties comparables (route, 40 à 60 km, D+ ≤ 500 m).'}</span></div>
 <h2>Kilométrage hebdomadaire</h2><div class="box">${bars(k8.map(x=>Math.round(x)),k8.map(x=>Math.round(x)))}<span class="mu">8 dernières semaines, vélo uniquement</span></div>
 <h2>Vitesse sur parcours comparables</h2><div class="box">${line(c.slice(-12).map(a=>({l:a.d,y:a.sp})))}</div>
 <h2>Sorties longues (70 km et plus)</h2><div class="box" style="padding:4px 14px">${lgl()}</div><h2>FC moyenne par sortie</h2><div class="box">${line(S.acts.filter(a=>bike(a)&&a.fa).sort((a,b)=>a.d.localeCompare(b.d)).slice(-12).map(a=>({l:a.d,y:a.fa})))}</div>`}

const F=(id,l,v,t='number',x='step="any" inputmode="decimal"',w='')=>`<label class="${w}">${l}<input id="a_${id}" type="${t}" value="${esc(v??'')}" ${t=='number'?x:''}></label>`;
function acts(){
 const e=edit?S.acts.find(a=>a.id==edit):null,v=e||draft||{d:td(),type:T[0]};
 const list=[...S.acts].sort((a,b)=>b.d.localeCompare(a.d)).map(a=>`<div class="row"><div><b>${fd(a.d)} · ${a.type}</b><br><span class="mu">${a.dist?f1(a.dist)+' km · ':''}${a.dur?hm(a.dur)+' · ':''}${a.sp?f1(a.sp)+' km/h · ':''}${a.dp?a.dp+' m D+ · ':''}${a.fa?'FC '+a.fa+(a.fm?'/'+a.fm:'')+' · ':''}${a.rpe?'ressenti '+a.rpe+'/10':''}${a.c?'<br>'+esc(a.c):''}</span></div>
 <div style="white-space:nowrap"><button class="b s" onclick="ed(${a.id})">Modifier</button> <button class="b d" onclick="del(${a.id})">Suppr.</button></div></div>`).join('');
 return`<div class="box"><label>Importer un fichier de ton compteur (.gpx ou .fit)<input type="file" accept=".gpx,.fit" onchange="imf(this)"></label><span class="mu">Les champs se remplissent : vérifie, ajoute ton ressenti, puis enregistre.</span></div><h2>${e?'Modifier la séance':'Nouvelle séance'}</h2><div class="box"><div class="f">
 ${F('d','Date',v.d,'date')}<label>Type<select id="a_t">${T.map(t=>`<option${t==v.type?' selected':''}>${t}</option>`).join('')}</select></label>
 ${F('dist','Distance (km)',v.dist)}${F('dur','Durée (min)',v.dur)}${F('sp','Vitesse moy. (km/h, auto si vide)',v.sp)}${F('dp','Dénivelé + (m)',v.dp)}
 ${F('fa','FC moyenne (bpm)',v.fa)}${F('fm','FC max (bpm)',v.fm)}${F('pw','Puissance moy. (W, option)',v.pw)}${F('rpe','Ressenti (1 à 10)',v.rpe)}
 <label class="w">Commentaire<textarea id="a_c" rows="2">${esc(v.c)}</textarea></label></div>
 <p class="ko" style="margin:8px 0 0">${msg}</p><button class="b" onclick="saveAct()">Enregistrer la séance</button>${e||draft?' <button class="b s" onclick="edit=null;draft=null;msg=\'\';R()">Annuler</button>':''}</div>
 <h2>Historique</h2><div class="box" style="padding:4px 14px">${list||'<p class="mu">Aucune séance. Saisis ta dernière sortie ci-dessus.</p>'}</div>
 <p class="mu">Import GPX et FIT disponible en haut de page. Le format TCX n’est pas géré.</p>`}
function saveAct(){const g=i=>$('#a_'+i).value;
 const a={id:edit||Date.now(),d:g('d'),type:g('t'),dist:n(g('dist')),dur:n(g('dur')),sp:n(g('sp')),dp:n(g('dp')),fa:n(g('fa')),fm:n(g('fm')),pw:n(g('pw')),rpe:n(g('rpe')),c:g('c').trim()};
 msg='';if(!a.d)msg='Choisis une date.';
 else if(a.type!='Repos'&&!a.dist&&!a.dur)msg='Renseigne au moins la distance ou la durée.';
 else if(a.fa&&a.fm&&a.fa>a.fm)msg='La FC moyenne dépasse la FC max : vérifie ta saisie.';
 else if(a.rpe&&(a.rpe<1||a.rpe>10))msg='Le ressenti doit être entre 1 et 10.';
 if(msg)return R();
 if(a.sp==null&&a.dist&&a.dur)a.sp=+(a.dist/(a.dur/60)).toFixed(1);
 S.acts=S.acts.filter(x=>x.id!=a.id).concat(a);edit=null;draft=null;save();R()}
function ed(id){edit=id;msg='';R();scrollTo(0,0)}
function del(id){if(confirm('Supprimer cette séance ?')){S.acts=S.acts.filter(a=>a.id!=id);save();R()}}

function plan(){
 const mon=addd(td(),-((new Date().getDay()+6)%7)),
 P=[["Repos ou marche","Récupération active, 20 à 30 min maximum."],["MyWhoosh : intervalles","Échauffement 15 min, 4 à 6 blocs de 4 min soutenus avec 3 min faciles, retour au calme 10 min."],["Renforcement","20 à 25 min : squats, fentes, gainage, ponts."],["MyWhoosh : endurance","45 à 60 min à intensité facile, tu dois pouvoir parler."],["Repos ou mobilité","Mobilité et gainage léger."],["Sortie route longue","2 à 3 h, allure régulière, mange et bois régulièrement."],["Récupération","Repos ou balade très facile."]];
 const k=[1,2,3].map(wkKm),lite=k[2]>0&&k[1]>k[2]&&k[0]>k[1],r=recovBad(),days=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
 return`<h2>Semaine en cours</h2>${r?'<div class="box wa">Ta récupération est basse aujourd’hui : remplace la séance prévue par du facile ou du repos.</div>':''}
 ${lite?'<div class="box wa">Ton volume a augmenté 3 semaines de suite : prévois une semaine allégée (environ 30 % de volume en moins).</div>':''}
 <div class="box" style="padding:4px 14px">${P.map((p,i)=>{const d=addd(mon,i),done=S.acts.filter(a=>a.d==d&&a.type!='Repos');
 return`<div class="row ${d==td()?'today':''}"><div><b>${days[i]} · ${p[0]}</b><br><span class="mu">${p[1]}</span></div><span class="${done.length?'ok':'mu'}">${done.length?'✓ '+f1(sum(done,a=>a.dist),0)+' km':''}</span></div>`}).join('')}</div>
 <p class="mu">Le programme se met à jour avec tes séances réalisées et ta récupération. La météo n’est pas encore intégrée.</p>`}

function coachV(){
 const A=S.acts,a=st(A.filter(x=>dn(x.d)<7)),b=st(A.filter(x=>dn(x.d)>=7&&dn(x.d)<14)),ok=[],ko=[],wa=[],r=recovBad();
 if(a.n>=2)ok.push(`${a.n} séances sur 7 jours : bonne régularité.`);else ko.push('Moins de 2 séances sur 7 jours : vise d’abord la régularité, avant l’intensité.');
 if(b.km>0&&a.km>b.km*1.2)wa.push(`Volume en hausse de ${Math.round((a.km/b.km-1)*100)} % : ne dépasse pas +10 % la semaine prochaine.`);
 else if(a.km>0)ok.push(`${f1(a.km,0)} km cette semaine, progression maîtrisée.`);
 const rs=A.filter(x=>dn(x.d)<7&&x.rpe).map(x=>x.rpe);if(rs.length&&avg(rs)>=8)wa.push('Ressenti moyen de 8/10 ou plus : intercale une séance facile et soigne ton sommeil.');
 const c=comp();if(c.length>=4){const l=avg(c.slice(-3).map(x=>x.sp)),p=avg(c.slice(-6,-3).map(x=>x.sp)),df=l-p;
  (df>0.2?ok:ko).push(`Sorties comparables : ${df>=0?'+':''}${f1(df)} km/h par rapport aux 3 précédentes.`)}
 else ko.push('Il faut au moins 4 sorties route de 40 à 60 km pour mesurer ta progression de vitesse.');
 const ll=lg(),pr=Math.max(0,...ll.filter(x=>dn(x.d)>=7&&dn(x.d)<35).map(x=>x.dist)),n7=ll.find(x=>dn(x.d)<7);
 if(n7&&pr&&n7.dist>pr*1.3)wa.push(`Sortie longue de ${f1(n7.dist,0)} km, soit ${Math.round((n7.dist/pr-1)*100)} % de plus que ta plus longue récente : allonge de 10 à 15 % maximum et mange dès la première heure.`);
 if(ll.length>=2){const[x,y]=ll,rx=(x.dp||0)/x.dist,ry=(y.dp||0)/y.dist;
  if(x.dp!=null&&y.dp!=null&&x.sp&&y.sp&&Math.abs(rx-ry)<=0.3*Math.max(rx,ry,.01))(x.sp>=y.sp?ok:ko).push(`Sortie longue vs la précédente, à relief comparable : ${x.sp>=y.sp?'+':''}${f1(x.sp-y.sp)} km/h.`);
  else ko.push('Tes deux dernières sorties longues ont un relief inconnu ou différent : pas de comparaison directe de vitesse.')}
 const t=wtrend(),w=S.weights.slice(-1)[0].w;
 if(t==null)ko.push('Pèse-toi sur au moins 7 jours d’écart pour estimer ta tendance de poids.');
 else if(t<-0.01*w)wa.push(`Perte de ${f1(-t,2)} kg/semaine : trop rapide, risque de perdre de la puissance. Mange davantage, surtout les jours de sortie.`);
 else if(t<=-0.2)ok.push(`Perte de ${f1(-t,2)} kg/semaine : rythme modéré, adapté à ton objectif.`);
 else ko.push(`Tendance de poids : ${t>0?'+':''}${f1(t,2)} kg/semaine, stable.`);
 if(r)wa.push('Ta récupération déclarée est basse : séance facile ou repos aujourd’hui.');
 const nx=a.km?Math.round(a.km*(r||wa.length?1:1.08)):null,L=l=>l.length?`<ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="mu">Rien à signaler.</p>';
 const rc=S.recov.find(x=>x.d==td())||{};
 const S5=(id,l,v)=>`<label>${l}<select id="r_${id}">${[1,2,3,4,5].map(i=>`<option${i==(v||3)?' selected':''}>${i}</option>`).join('')}</select></label>`;
 return`<h2>Bilan des 7 derniers jours</h2><div class="box"><h3 class="ok">Points positifs</h3>${L(ok)}<h3 class="wa">Signes à surveiller</h3>${L(wa)}<h3>À améliorer</h3>${L(ko)}
 <h3>Semaine suivante</h3><p>${nx?`Vise environ ${nx} km au maximum (+10 % de plus que cette semaine).`:'Commence par 2 séances faciles.'} ${wa.length?'Garde l’intensité basse et décale les intervalles.':'Garde 1 séance d’intervalles, le reste en endurance facile.'}</p></div>

function gpx(t){const x=new DOMParser().parseFromString(t,'application/xml'),p=[...x.getElementsByTagName('trkpt')];if(p.length<2)throw 0;
 const ex=(e,re)=>{const m=[...e.getElementsByTagName('*')].find(z=>re.test(z.nodeName));return m?+m.textContent:null};
 let dist=0,dp=0,mv=0,ref=null,pr=null,t0=null;const hr=[],pw=[];
 p.forEach(e=>{const la=+e.getAttribute('lat')*Math.PI/180,lo=+e.getAttribute('lon')*Math.PI/180,el=e.getElementsByTagName('ele')[0],tm=e.getElementsByTagName('time')[0],h=ex(e,/(^|:)hr$/),w=ex(e,/(^|:)(power|watts)$/),ts=tm?Date.parse(tm.textContent):null;
  if(t0==null)t0=ts;
  if(pr){const a=Math.sin((la-pr.la)/2)**2+Math.cos(la)*Math.cos(pr.la)*Math.sin((lo-pr.lo)/2)**2;dist+=12742000*Math.asin(Math.sqrt(a));if(ts&&pr.ts&&ts-pr.ts<=3e4)mv+=ts-pr.ts}
  if(el){const z=+el.textContent;if(ref==null)ref=z;if(z-ref>3){dp+=z-ref;ref=z}else if(ref-z>3)ref=z}
  if(h)hr.push(h);if(w)pw.push(w);pr={la,lo,ts}});
 const km=dist/1000,mn=mv/6e4;
 return{d:t0?new Date(t0).toLocaleDateString('sv'):td(),dist:+km.toFixed(1),dur:Math.round(mn)||null,sp:mn?+(km/(mn/60)).toFixed(1):null,dp:Math.round(dp),fa:hr.length?Math.round(avg(hr)):null,fm:hr.length?Math.max(...hr):null,pw:pw.length?Math.round(avg(pw)):null}}
function fit(b){const v=new DataView(b),df={},Q={};let o=v.getUint8(0);const end=Math.min(b.byteLength-2,o+v.getUint32(4,true));
 const rd=(p,s,le)=>s==1?v.getUint8(p):s==2?v.getUint16(p,le):s==4?v.getUint32(p,le):null,bad=(x,s)=>x==null||x==(s==1?255:s==2?65535:4294967295);
 while(o<end){const h=v.getUint8(o++);
  if(h&128){const d=df[(h>>5)&3];if(!d)break;o+=d.z;continue}
  const k=h&15;
  if(h&64){const le=v.getUint8(o+1)==0,g=v.getUint16(o+2,le),nf=v.getUint8(o+4),f=[];let z=0;o+=5;
   for(let i=0;i<nf;i++){f.push([v.getUint8(o),v.getUint8(o+1)]);z+=v.getUint8(o+1);o+=3}
   if(h&32){const nd=v.getUint8(o++);for(let i=0;i<nd;i++){z+=v.getUint8(o+1);o+=3}}
   df[k]={g,le,f,z}}
  else{const d=df[k];if(!d)break;
   if(d.g==18&&!Q.s){let p=o;const s={};d.f.forEach(([n,z])=>{const x=rd(p,z,d.le);if(!bad(x,z))s[n]=x;p+=z});if(s[9])Q.s=s}
   o+=d.z}}
 const s=Q.s;if(!s)throw 0;const mn=(s[8]||s[7])/6e4,km=s[9]/1e5;
 return{d:s[2]?new Date((631065600+s[2])*1000).toLocaleDateString('sv'):td(),dist:+km.toFixed(1),dur:Math.round(mn),sp:+(km/(mn/60)).toFixed(1),dp:s[22]??null,fa:s[16]??null,fm:s[17]??null,pw:s[20]??null}}
function imf(i){const f=i.files[0];if(!f)return;const r=new FileReader(),isF=/\.fit$/i.test(f.name);
 r.onload=()=>{try{draft=Object.assign({d:td(),type:T[0]},isF?fit(r.result):gpx(r.result));edit=null;msg='';R();scrollTo(0,0)}catch(e){msg='Fichier illisible : exporte-le de nouveau depuis ton compteur (GPX ou FIT).';R()}};
 isF?r.readAsArrayBuffer(f):r.readAsText(f)}
const WC=c=>c==0?['☀️','Dégagé']:c<3?['🌤️','Peu nuageux']:c==3?['☁️','Couvert']:c<=48?['🌫️','Brouillard']:c<=57?['🌦️','Bruine']:c<=67?['🌧️','Pluie']:c<=77?['❄️','Neige']:c<=82?['🌧️','Averses']:c<=86?['❄️','Averses de neige']:['⛈️','Orage'];
const CP=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'],cp=d=>CP[Math.round(d/22.5)%16];

async function loadWx(){wxBusy=true;wxErr='';R();
 try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=47.081&longitude=2.398&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m&timezone=Europe%2FParis&forecast_days=2');
  if(!r.ok)throw 0;wx={t:Date.now(),h:(await r.json()).hourly};try{localStorage.setItem('vcwx',JSON.stringify(wx))}catch(e){}}
 catch(e){wxErr='Impossible de joindre le service météo (hors ligne, ou aperçu Claude qui bloque les requêtes externes).'}
 wxBusy=false;R()}
function wxV(){let o='<h2>Météo à Bourges</h2>',rows=null;
 if(wx&&wx.h){const h=wx.h,now=new Date().toLocaleString('sv',{timeZone:'Europe/Paris'}).slice(0,13).replace(' ','T')+':00',i=h.time.findIndex(x=>x>=now);
  if(i>=0&&i+3<h.time.length)rows=[0,1,2,3].map(k=>({t:h.time[i+k].slice(11),c:WC(h.weather_code[i+k]),T:h.temperature_2m[i+k],pp:h.precipitation_probability[i+k],mm:h.precipitation[i+k],v:h.wind_speed_10m[i+k],g:h.wind_gusts_10m[i+k],d:h.wind_direction_10m[i+k]}))}
 if(wxErr)o+=`<div class="box ko">${wxErr}</div>`;
 if(rows){const mx=Math.max(...rows.map(r=>r.pp)),mt=Math.min(...rows.map(r=>r.T)),mg=Math.max(...rows.map(r=>r.g)),av=avg(rows.map(r=>r.v)),tips=[];
  if(mx>=60||rows.some(r=>r.mm>=0.5))tips.push('Pluie probable : prends une veste imperméable.');
  if(mt<6)tips.push('Il fait froid : gants, couvre-chaussures et coupe-vent.');
  if(mg>=40)tips.push('Rafales fortes : prudence en terrain découvert.');
  if(av>=20)tips.push(`Vent soutenu de ${cp(rows[0].d)} : pars face au vent pour rentrer avec le vent dans le dos.`);
  o+=`<div class="box" style="padding:4px 14px">${rows.map((r,k)=>`<div class="row"><div><b>${k?'+'+k+' h':'Maintenant'}</b> <span class="mu">${r.t}</span><br>${r.c[0]} ${r.c[1]}<br><span class="mu">Pluie ${r.pp} % · ${f1(r.mm)} mm</span></div><div style="text-align:right"><b style="font:700 30px 'Barlow Condensed',sans-serif">${Math.round(r.T)} °C</b><br><span style="display:inline-block;transform:rotate(${r.d+180}deg)">↑</span> Vent de ${cp(r.d)} ${Math.round(r.v)} km/h<br><span class="mu">rafales ${Math.round(r.g)} km/h</span></div></div>`).join('')}</div>${tips.length?`<div class="box"><ul>${tips.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}<p class="mu">Mis à jour à ${new Date(wx.t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}. La flèche indique la direction vers laquelle souffle le vent. Prévisions Open-Meteo.</p>`}
 else if(wx&&!wxErr)o+='<div class="box wa">Les dernières prévisions enregistrées sont trop anciennes : actualise.</div>';
 else if(!wxErr)o+='<p class="mu">Chargement…</p>';
 return o+`<button class="b" onclick="loadWx()" ${wxBusy?'disabled':''}>${wxBusy?'Actualisation…':'Actualiser'}</button>`}
